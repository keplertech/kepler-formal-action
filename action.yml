name: Kepler Formal Compare
description: Run kepler-formal through a published or locally built container against a caller-provided config file.
inputs:
  config-path:
    description: Path to a kepler-formal YAML config file inside the checked-out workspace.
    required: true
  artifact-dir:
    description: Workspace-relative directory where the action writes logs and copied inputs.
    required: false
    default: .kepler-formal-action
  write-step-summary:
    description: Whether to append a short execution summary to the GitHub step summary.
    required: false
    default: 'true'
outputs:
  artifact-dir:
    description: Workspace-relative directory containing the generated action artifacts.
    value: ${{ steps.run.outputs.artifact-dir }}
  exit-code:
    description: Exit code returned by kepler-formal.
    value: ${{ steps.run.outputs.exit-code }}
  status:
    description: Final action status, success or failure.
    value: ${{ steps.run.outputs.status }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REF: ${{ github.action_ref }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        INPUT_ARTIFACT_DIR: ${{ inputs.artifact-dir }}
        INPUT_CONFIG_PATH: ${{ inputs.config-path }}
        INPUT_WRITE_STEP_SUMMARY: ${{ inputs.write-step-summary }}
      run: bash "$ACTION_PATH/run-action.sh"
branding:
  icon: activity
  color: blue
