name: smoke-test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-matrix:
    name: smoke matrix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the pinned kepler-formal release
        run: |
          version=$(sed -n '/^  kepler-formal-version:/,/default:/s/^ *default: *//p' action.yml)
          python -m pip install --quiet "kepler-formal==$version" "PyYAML>=6"

      - name: Run the smoke matrix
        run: ci/smoke.sh .artifacts/smoke

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-artifacts-${{ matrix.os }}
          path: .artifacts/smoke
          if-no-files-found: warn

  action-contract:
    name: action contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Equivalent Verilog netlists from a config pass
        id: config-equivalent
        uses: ./
        with:
          config-path: testdata/verilog/configs/equivalent.yaml
          artifact-dir: .artifacts/config-equivalent

      - name: SEC with a reset bootstrap from direct inputs passes
        id: inputs-sec
        uses: ./
        with:
          design1: testdata/systemverilog/cases/dff-async-reset/reference/*.sv
          design2: testdata/systemverilog/cases/dff-async-reset/latest/*.sv
          top: top
          mode: sec
          sec-engine: pdr
          reset-ports: rst_n=0
          reset-cycles: '2'
          artifact-dir: .artifacts/inputs-sec

      - name: A SEC counterexample fails the step
        id: inputs-mismatch
        continue-on-error: true
        uses: ./
        with:
          design1: testdata/systemverilog/cases/operator-mismatch-basic/reference/top.sv
          design2: testdata/systemverilog/cases/operator-mismatch-basic/latest/top.sv
          mode: sec
          artifact-dir: .artifacts/inputs-mismatch

      - name: Check outputs
        env:
          EQ_VERDICT: ${{ steps.config-equivalent.outputs.verdict }}
          SEC_VERDICT: ${{ steps.inputs-sec.outputs.verdict }}
          MISMATCH_OUTCOME: ${{ steps.inputs-mismatch.outcome }}
          MISMATCH_VERDICT: ${{ steps.inputs-mismatch.outputs.verdict }}
          MISMATCH_EXIT: ${{ steps.inputs-mismatch.outputs.exit-code }}
          ARTIFACT_DIR: ${{ steps.inputs-mismatch.outputs.artifact-dir }}
        run: |
          set -x
          test "$EQ_VERDICT" = equivalent
          test "$SEC_VERDICT" = equivalent
          test "$MISMATCH_OUTCOME" = failure
          test "$MISMATCH_VERDICT" = different
          test "$MISMATCH_EXIT" = 3
          test -s "$ARTIFACT_DIR/kepler-formal.log"
          grep -q 'Input trace' "$ARTIFACT_DIR/summary.md"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: action-artifacts-${{ matrix.os }}
          path: .artifacts
          if-no-files-found: warn
