name: smoke-test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verilog equivalent netlists should pass
        id: verilog-equivalent
        uses: ./
        with:
          config-path: testdata/verilog/configs/equivalent.yaml
          artifact-dir: .artifacts/verilog-equivalent

      - name: Upload verilog equivalent artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verilog-equivalent-artifacts
          path: .artifacts/verilog-equivalent
          if-no-files-found: warn

      - name: Verilog mismatching netlists should fail
        id: verilog-mismatch
        continue-on-error: true
        uses: ./
        with:
          config-path: testdata/verilog/configs/mismatch.yaml
          artifact-dir: .artifacts/verilog-mismatch

      - name: Assert verilog mismatch failure
        if: always()
        run: |
          if [ "${{ steps.verilog-mismatch.outcome }}" != "failure" ]; then
            echo "Expected the mismatching fixture to fail." >&2
            exit 1
          fi

      - name: Upload verilog mismatch artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verilog-mismatch-artifacts
          path: .artifacts/verilog-mismatch
          if-no-files-found: warn

      - name: SystemVerilog operator-style netlists should fail on mismatch
        id: systemverilog-operator-mismatch
        continue-on-error: true
        uses: ./
        with:
          config-path: testdata/systemverilog/configs/operator-mismatch.yaml
          artifact-dir: .artifacts/systemverilog-operator-mismatch

      - name: Assert systemverilog operator mismatch failure
        if: always()
        run: |
          if [ "${{ steps.systemverilog-operator-mismatch.outcome }}" != "failure" ]; then
            echo "Expected the SystemVerilog operator-style fixture to fail on mismatch." >&2
            exit 1
          fi

      - name: Upload systemverilog operator mismatch artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systemverilog-operator-mismatch-artifacts
          path: .artifacts/systemverilog-operator-mismatch
          if-no-files-found: warn

      - name: SystemVerilog synchronous DFF netlists should pass
        id: systemverilog-dff-sync
        uses: ./
        with:
          config-path: testdata/systemverilog/configs/dff-sync.yaml
          artifact-dir: .artifacts/systemverilog-dff-sync

      - name: Upload systemverilog synchronous DFF artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systemverilog-dff-sync-artifacts
          path: .artifacts/systemverilog-dff-sync
          if-no-files-found: warn

      - name: SystemVerilog async-reset DFF netlists should pass
        id: systemverilog-dff-async-reset
        uses: ./
        with:
          config-path: testdata/systemverilog/configs/dff-async-reset.yaml
          artifact-dir: .artifacts/systemverilog-dff-async-reset

      - name: Upload systemverilog async-reset DFF artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systemverilog-dff-async-reset-artifacts
          path: .artifacts/systemverilog-dff-async-reset
          if-no-files-found: warn

      - name: Complex SystemVerilog netlists should fail on combinational mismatch
        id: systemverilog-complex-comb-mismatch
        continue-on-error: true
        uses: ./
        with:
          config-path: testdata/systemverilog/configs/complex-comb-mismatch.yaml
          artifact-dir: .artifacts/systemverilog-complex-comb-mismatch

      - name: Assert complex systemverilog combinational mismatch failure
        if: always()
        run: |
          if [ "${{ steps.systemverilog-complex-comb-mismatch.outcome }}" != "failure" ]; then
            echo "Expected the complex SystemVerilog fixture to fail on combinational mismatch." >&2
            exit 1
          fi

      - name: Upload complex systemverilog mismatch artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systemverilog-complex-comb-mismatch-artifacts
          path: .artifacts/systemverilog-complex-comb-mismatch
          if-no-files-found: warn