name: candidate-image

on:
  pull_request:
  workflow_dispatch:
    inputs:
      kepler-formal-commit:
        description: Optional kepler-formal git ref or commit hash to test without editing Dockerfile.
        required: false
        type: string

permissions:
  contents: read

jobs:
  candidate-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve kepler-formal commit
        id: kepler-commit
        env:
          OVERRIDE_COMMIT: ${{ github.event.inputs['kepler-formal-commit'] || '' }}
        run: |
          set -euo pipefail

          if [ -n "$OVERRIDE_COMMIT" ]; then
            echo "value=$OVERRIDE_COMMIT" >> "$GITHUB_OUTPUT"
            echo "source=workflow-dispatch" >> "$GITHUB_OUTPUT"
          else
            default_commit="$(grep '^ARG KEPLER_FORMAL_COMMIT=' Dockerfile | cut -d= -f2-)"
            echo "value=$default_commit" >> "$GITHUB_OUTPUT"
            echo "source=dockerfile" >> "$GITHUB_OUTPUT"
          fi

      - name: Build candidate image
        env:
          IMAGE_TAG: kepler-formal-action-candidate:${{ github.sha }}
        run: |
          set -euo pipefail

          docker build \
            --build-arg "KEPLER_FORMAL_COMMIT=${{ steps.kepler-commit.outputs.value }}" \
            -t "$IMAGE_TAG" \
            .

      - name: Smoke test candidate image
        env:
          IMAGE_TAG: kepler-formal-action-candidate:${{ github.sha }}
        run: |
          set -euo pipefail

          mkdir -p .tmp/candidate .artifacts/candidate
          : > .tmp/candidate/github_output
          : > .tmp/candidate/github_summary

          cat > .artifacts/candidate/build-metadata.txt <<EOF
          image_tag=$IMAGE_TAG
          kepler_formal_commit=${{ steps.kepler-commit.outputs.value }}
          kepler_formal_commit_source=${{ steps.kepler-commit.outputs.source }}
          git_sha=${GITHUB_SHA}
          EOF

          run_case() {
            local case_name="$1"
            local expected="$2"
            local config_path="$3"
            local artifact_dir="$4"
            local exit_code

            set +e
            docker run --rm \
              -v "$PWD":/github/workspace \
              -e GITHUB_WORKSPACE=/github/workspace \
              -e GITHUB_OUTPUT=/github/workspace/.tmp/candidate/github_output \
              -e GITHUB_STEP_SUMMARY=/github/workspace/.tmp/candidate/github_summary \
              "$IMAGE_TAG" \
              "$config_path" \
              "$artifact_dir" \
              true
            exit_code=$?
            set -e

            case "$expected" in
              success)
                if [ "$exit_code" -ne 0 ]; then
                  echo "Case $case_name was expected to succeed but exited with $exit_code." >&2
                  return 1
                fi
                ;;
              failure)
                if [ "$exit_code" -eq 0 ]; then
                  echo "Case $case_name was expected to fail but exited with 0." >&2
                  return 1
                fi
                ;;
              *)
                echo "Unsupported expectation: $expected" >&2
                return 1
                ;;
            esac
          }

          run_case \
            verilog-equivalent \
            success \
            testdata/verilog/configs/equivalent.yaml \
            .artifacts/candidate/verilog-equivalent

          run_case \
            verilog-mismatch \
            failure \
            testdata/verilog/configs/mismatch.yaml \
            .artifacts/candidate/verilog-mismatch

          run_case \
            systemverilog-operator-mismatch \
            failure \
            testdata/systemverilog/configs/operator-mismatch.yaml \
            .artifacts/candidate/systemverilog-operator-mismatch

          run_case \
            systemverilog-dff-sync \
            success \
            testdata/systemverilog/configs/dff-sync.yaml \
            .artifacts/candidate/systemverilog-dff-sync

          run_case \
            systemverilog-dff-async-reset \
            success \
            testdata/systemverilog/configs/dff-async-reset.yaml \
            .artifacts/candidate/systemverilog-dff-async-reset

          run_case \
            systemverilog-complex-comb-mismatch \
            failure \
            testdata/systemverilog/configs/complex-comb-mismatch.yaml \
            .artifacts/candidate/systemverilog-complex-comb-mismatch

      - name: Upload candidate image artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-image-artifacts
          path: |
            .artifacts/candidate
            .tmp/candidate
          if-no-files-found: warn