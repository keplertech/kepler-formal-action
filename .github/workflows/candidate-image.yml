name: candidate-image

on:
  pull_request:
  workflow_dispatch:
    inputs:
      kepler-formal-commit:
        description: Optional kepler-formal git ref or 40-character commit to test without changing flake.lock.
        required: false
        type: string

permissions:
  contents: read

jobs:
  candidate-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.1/install

      - name: Resolve optional kepler-formal override
        id: kepler-input
        env:
          OVERRIDE_COMMIT: ${{ github.event.inputs['kepler-formal-commit'] || '' }}
        run: |
          set -euo pipefail

          if [[ -z "$OVERRIDE_COMMIT" ]]; then
            echo "flake-url=" >> "$GITHUB_OUTPUT"
            echo "source=flake.lock" >> "$GITHUB_OUTPUT"
          elif [[ "$OVERRIDE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "flake-url=git+https://github.com/keplertech/kepler-formal?rev=$OVERRIDE_COMMIT&submodules=1" >> "$GITHUB_OUTPUT"
            echo "source=workflow-dispatch-commit" >> "$GITHUB_OUTPUT"
          else
            echo "flake-url=git+https://github.com/keplertech/kepler-formal?ref=$OVERRIDE_COMMIT&submodules=1" >> "$GITHUB_OUTPUT"
            echo "source=workflow-dispatch-ref" >> "$GITHUB_OUTPUT"
          fi

      - name: Build candidate image from Nix
        env:
          IMAGE_TAG: kepler-formal-action-candidate:${{ github.sha }}
          KEPLER_FORMAL_FLAKE_OVERRIDE: ${{ steps.kepler-input.outputs.flake-url }}
        run: ./build-image.sh "$IMAGE_TAG"

      - name: Record candidate metadata
        env:
          IMAGE_TAG: kepler-formal-action-candidate:${{ github.sha }}
          INPUT_SOURCE: ${{ steps.kepler-input.outputs.source }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/candidate
          upstream_revision=$(docker inspect \
            --format '{{ index .Config.Labels "io.keplertech.kepler-formal.revision" }}' \
            "$IMAGE_TAG")
          cat > .artifacts/candidate/build-metadata.txt <<EOF
          image_tag=$IMAGE_TAG
          kepler_formal_revision=$upstream_revision
          kepler_formal_input_source=$INPUT_SOURCE
          git_sha=$GITHUB_SHA
          EOF

      - name: Smoke test candidate image
        env:
          IMAGE_TAG: kepler-formal-action-candidate:${{ github.sha }}
        run: ./ci/smoke-image.sh "$IMAGE_TAG" .artifacts/candidate .tmp/candidate

      - name: Upload candidate image artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-image-artifacts
          path: |
            .artifacts/candidate
            .tmp/candidate
          if-no-files-found: warn
