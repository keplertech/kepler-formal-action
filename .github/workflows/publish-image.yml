name: publish-image

on:
  push:
    branches:
      - main
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      image-tag:
        description: Image tag to publish, for example v1.2.3-rc1.
        required: true
        type: string

permissions:
  contents: read
  packages: write
  attestations: write
  artifact-metadata: write
  id-token: write

concurrency:
  group: publish-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/kepler-formal-action
  LOCAL_IMAGE: kepler-formal-action-release:${{ github.sha }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.1/install

      - name: Resolve image version
        id: version
        env:
          MANUAL_TAG: ${{ github.event.inputs['image-tag'] || '' }}
        run: |
          set -euo pipefail

          if [[ -n "$MANUAL_TAG" ]]; then
            version="$MANUAL_TAG"
          elif [[ "$GITHUB_REF_TYPE" = "tag" ]]; then
            version="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF_NAME" = "main" ]]; then
            version="main"
          else
            echo "Unsupported publish trigger. Use main, a semantic version tag, or workflow_dispatch with image-tag." >&2
            exit 1
          fi

          if [[ ! "$version" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid OCI image tag: $version" >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build the locked Nix image
        run: ./build-image.sh "$LOCAL_IMAGE"

      - name: Record release metadata
        id: metadata
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/publish
          upstream_revision=$(docker inspect \
            --format '{{ index .Config.Labels "io.keplertech.kepler-formal.revision" }}' \
            "$LOCAL_IMAGE")
          echo "upstream-revision=$upstream_revision" >> "$GITHUB_OUTPUT"
          cat > .artifacts/publish/build-metadata.txt <<EOF
          image_tag=$LOCAL_IMAGE
          image_version=$IMAGE_VERSION
          kepler_formal_revision=$upstream_revision
          git_sha=$GITHUB_SHA
          EOF

      - name: Smoke test the exact image to publish
        run: ./ci/smoke-image.sh "$LOCAL_IMAGE" .artifacts/publish .tmp/publish

      - name: Upload release candidate artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: publish-image-smoke-artifacts
          path: |
            .artifacts/publish
            .tmp/publish
          if-no-files-found: warn

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::12}"
          tags=(
            "$REGISTRY/$IMAGE_NAME:$IMAGE_VERSION"
            "$REGISTRY/$IMAGE_NAME:sha-$short_sha"
          )

          if [[ "$IMAGE_VERSION" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            tags+=("$REGISTRY/$IMAGE_NAME:v${BASH_REMATCH[1]}")
            tags+=("$REGISTRY/$IMAGE_NAME:v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}")
          fi

          {
            echo 'value<<EOF'
            printf '%s\n' "${tags[@]}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Publish the smoke-tested image
        id: push
        env:
          IMAGE_TAGS: ${{ steps.tags.outputs.value }}
        run: |
          set -euo pipefail
          digest=""

          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker tag "$LOCAL_IMAGE" "$tag"
            push_output=$(docker push "$tag")
            printf '%s\n' "$push_output"
            if [[ -z "$digest" ]]; then
              digest=$(sed -n 's/^.*digest: \(sha256:[0-9a-f]*\).*$/\1/p' <<< "$push_output" | tail -1)
            fi
          done <<< "$IMAGE_TAGS"

          if [[ -z "$digest" ]]; then
            echo "Could not determine the published image digest." >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest the published image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
